name: Build Viewer release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated Viewer tag to build (for example, viewer/v0.1.0)
        required: true
        type: string
      release_notes:
        description: Initial GitHub Release notes.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: viewer-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  verify:
    name: Verify ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Viewer release tag
        id: release
        shell: bash
        env:
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$(git cat-file -t "$TARGET_TAG")" != "tag" ]]; then
            echo "'$TARGET_TAG' must be an annotated tag." >&2
            exit 2
          fi
          version="$(python3 eng/version.py get viewer)"
          expected="viewer/v$version"
          if [[ "$TARGET_TAG" != "$expected" ]]; then
            echo "Expected Viewer tag '$expected', got '$TARGET_TAG'." >&2
            exit 2
          fi
          python3 eng/version.py verify viewer
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Numos.slnx -c Release -warnaserror

      - name: Run tests
        run: dotnet test Numos.slnx -c Release --no-build --no-restore

  publish:
    name: Publish NativeAOT (${{ matrix.rid }})
    needs: [verify, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive_extension: tar.gz
          - os: windows-latest
            rid: win-x64
            archive_extension: zip
          - os: macos-14
            rid: osx-arm64
            archive_extension: tar.gz

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained NativeAOT application
        shell: pwsh
        env:
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          $publishDirectory = "artifacts/viewer/${{ matrix.rid }}"
          dotnet publish src/Numos.Viewer/Numos.Viewer.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            --output $publishDirectory `
            -p:PublishAot=true `
            -p:ContinuousIntegrationBuild=true `
            -p:SourceRevisionId="${{ needs.verify.outputs.commit }}" `
            -p:RepositoryCommit="${{ needs.verify.outputs.commit }}" `
            -p:SourceBranchName="refs/tags/$env:TARGET_TAG" `
            -p:RepositoryBranch="refs/tags/$env:TARGET_TAG"

      - name: Archive NativeAOT application
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/viewer/${{ matrix.rid }}"
          $archiveDirectory = "artifacts/release-assets"
          $archivePath = "$archiveDirectory/Numos.Viewer-${{ needs.verify.outputs.version }}-${{ matrix.rid }}.${{ matrix.archive_extension }}"
          New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
          if ("${{ matrix.archive_extension }}" -eq "zip") {
            Compress-Archive -Path "$publishDirectory/*" -DestinationPath $archivePath -Force
          } else {
            tar -czf $archivePath -C $publishDirectory .
          }

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: viewer-${{ matrix.rid }}
          path: artifacts/release-assets/*
          if-no-files-found: error

  create_draft:
    name: Create GitHub Release draft
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download NativeAOT applications
        uses: actions/download-artifact@v8
        with:
          pattern: viewer-*
          path: release-assets
          merge-multiple: true

      - name: Create draft and attach applications
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          if gh release view "$TARGET_TAG" --json isDraft --jq '.isDraft' >/tmp/is-draft 2>/dev/null; then
            if [[ "$(< /tmp/is-draft)" != "true" ]]; then
              echo "The GitHub Release for '$TARGET_TAG' is already published; refusing to modify it." >&2
              exit 2
            fi
          else
            prerelease=()
            if [[ "$VERSION" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$TARGET_TAG" \
              --draft \
              "${prerelease[@]}" \
              --title "Numos Viewer v$VERSION" \
              --notes-file release-notes.md
          fi
          gh release upload "$TARGET_TAG" release-assets/* --clobber
